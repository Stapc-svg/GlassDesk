name: glassdesk
base: core22
adopt-info: glassdesk
summary: Glass desktop organizer with fences and widgets
description: |
  GlassDesk sorts the files on your desktop into frosted-glass fences
  (Apps, Folders, Documents, Images...) and adds widgets: clock, system
  monitor, calendar, notes, to-do, weather, music, GitHub stats, network
  meter and a focus timer. Stack fences and widgets into tabs, search with
  a quick launcher, and pick from 26 themes. Free and open source (MIT).
license: MIT
website: https://github.com/Stapc-svg/GlassDesk
source-code: https://github.com/Stapc-svg/GlassDesk
issues: https://github.com/Stapc-svg/GlassDesk/issues
grade: stable
confinement: strict

architectures:
  - build-on: [amd64]
  - build-on: [arm64]

apps:
  glassdesk:
    command: bin/glassdesk
    desktop: meta/gui/glassdesk.desktop
    extensions: [gnome]
    environment:
      PYTHONPATH: $SNAP/lib/glassdesk:$SNAP/usr/lib/python3/dist-packages
    plugs:
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - network
      - unity7
      - system-observe
      - network-observe
      - hardware-observe

parts:
  glassdesk:
    plugin: dump
    source: linux
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' glassdesk/core.py)"
    organize:
      glassdesk: lib/glassdesk/glassdesk
    stage:
      - lib/glassdesk
    stage-packages:
      - python3
      - python3-gi
      - python3-gi-cairo
      - gir1.2-ayatanaappindicator3-0.1
      - gir1.2-keybinder-3.0
      - libnotify-bin
  launcher:
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/bin
      cat > $CRAFT_PART_INSTALL/bin/glassdesk <<'SH'
      #!/bin/sh
      exec "$SNAP/usr/bin/python3" -m glassdesk "$@"
      SH
      chmod 755 $CRAFT_PART_INSTALL/bin/glassdesk
